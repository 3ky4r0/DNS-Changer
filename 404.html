<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    p {
      font-size: 16px;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #282828;
        color: #e1e1e1;
      }

      p {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Page Not Found</p>
</body>
</html>
