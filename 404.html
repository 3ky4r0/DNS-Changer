<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Changer</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);

      // Check if the last segment looks like a file with extension
      var lastSegment = segments[segments.length - 1] || '';
      var isFile = /\.[a-zA-Z0-9]+$/.test(lastSegment);

      if (segments.length > 0 && !isFile) {
        var key = lastSegment;
        var repoPrefix = segments.length > 1 ? '/' + segments.slice(0, -1).join('/') + '/' : '/';
        var search = window.location.search ? '&' + window.location.search.replace(/^\?/, '') : '';
        var hash = window.location.hash || '';

        var redirectTarget = repoPrefix + 'preview.html?key=' + encodeURIComponent(key) + search + hash;
        window.location.replace(redirectTarget);
        return;
      }

      // Default fallback to root
      var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(base);
    })();
  </script>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loading-box {
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <p>Redirecting...</p>
  </div>
</body>
</html>
