<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Changer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="unsupportedDevice" class="unsupported-device hidden">
    <div class="unsupported-content">
      <i data-lucide="monitor"></i>
      <h1>Windows Only</h1>
      <p>This tool only supports Windows. Please open this page on a Windows PC.</p>
    </div>
  </div>

  <div id="app" class="app">
    <header class="header">
      <div class="logo">
        <a href="./" id="homeLink" class="logo-link">
          <h1>DNS Changer</h1>
        </a>
      </div>
      <div class="header-actions">
        <button id="dhcpBtn" class="btn">Reset DHCP</button>
        <a href="https://github.com/3ky4r0/DNS-Changer" target="_blank" rel="noopener noreferrer" class="btn">GitHub</a>
      </div>
    </header>

    <main id="listView" class="content-area">
      <div id="loading" class="status-box">
        <div class="spinner"></div>
      </div>
      <div id="error" class="status-box hidden">
        <span>Failed to load data.</span>
        <button id="retryBtn" class="btn">Retry</button>
      </div>
      <div id="dnsList" class="dns-list"></div>
    </main>

    <main id="detailView" class="content-area detail-view hidden">
      <pre class="code-preview"><code id="detailCode"></code></pre>
      <div class="detail-actions">
        <button id="copyCodeBtn" class="btn btn-icon-btn" title="Copy" aria-label="Copy">
          <i data-lucide="copy"></i>
        </button>
        <button id="downloadBtn" class="btn btn-icon-btn" title="Download .BAT" aria-label="Download .BAT">
          <i data-lucide="download"></i>
        </button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
